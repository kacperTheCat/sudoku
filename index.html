<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sudoku:v1:settings');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="description" content="Gra w sudoku z zapisem postępu — generuj planszę i graj offline." />

    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./icon-source.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sudoku" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Sudoku</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
